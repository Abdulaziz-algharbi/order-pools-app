worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

  # Add more `server` lines here to scale the backend horizontally — nginx
  # load-balances across them with no other config change, since the
  # backend is stateless (JWT auth, no sockets, no file uploads).
  upstream backend {
    server backend:8000;
  }

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root  /usr/share/nginx/html;
    index index.html;

    # Reverse proxy to the Express API. No path rewrite: the backend's own
    # routes are already mounted at /api/v1/*, and proxy_pass with no URI
    # component on the upstream name forwards the incoming URI unchanged.
    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: client-side routes (e.g. /retailer/pools) aren't real
    # files, so unmatched paths serve index.html and React Router takes it
    # from there.
    location / {
      try_files $uri /index.html;
    }
  }
}
